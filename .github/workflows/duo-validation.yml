name: duo-validation

# iPhone Duo (October 23) and the iOS 27.1 SDK (Joe, October 12: Duo
# compatibility in 1.0). Apple's guidance: apps run unchanged, but only a
# build with the iOS 27.1 SDK uses the inner display's full screen. This
# runs the same harness as native-validation on the xcode-27 image, which
# has Xcode 27.1 and an "iPhone Duo" simulator device type:
#   - "ios27":  the usual iPhone + iPad simulators on the iOS 27 runtime,
#               built with Xcode 27.1 — is the app and its test-suite OK
#               with the new toolchain and OS?
#   - "duo":    the iPhone Duo simulator stands in for the iPhone.
# Manual until it is green; then it decides whether release.yml moves to
# Xcode 27.1 before submission.

on:
  workflow_dispatch:
    inputs:
      xcode:
        description: "Xcode app version on the xcode-27 image (27.1, 27.2)"
        required: true
        default: "27.1"
        type: string

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.pass }} (Xcode ${{ inputs.xcode }})
    runs-on: xcode-27
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        pass: [ios27, duo]
    env:
      RESULTS: ${{ github.workspace }}/native-validation/results
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          app="/Applications/Xcode_${{ inputs.xcode }}.app"
          [ -d "$app" ] || { echo "::error::$app is not on this image"; ls -d /Applications/Xcode*.app; exit 1; }
          echo "DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"
          "$app/Contents/Developer/usr/bin/xcodebuild" -version
      - name: Simulators
        run: |
          xcrun simctl list runtimes available
          xcrun simctl list devices available | grep -iE "iphone|ipad" || true
          if [ "${{ matrix.pass }}" = "duo" ]; then
            if ! xcrun simctl list devices available | grep -q "iPhone Duo"; then
              runtime=$(xcrun simctl list runtimes available -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x["platform"]=="iOS"]; r.sort(key=lambda x: [int(p) for p in x["version"].split(".")]); print(r[-1]["identifier"])')
              xcrun simctl create "iPhone Duo" com.apple.CoreSimulator.SimDeviceType.iPhone-Duo "$runtime"
            fi
            xcrun simctl list devices available | grep "iPhone Duo"
            echo "DT_IPHONE_REGEX=^iPhone Duo$" >> "$GITHUB_ENV"
          fi
      - name: Build + XCTest + swift test
        id: native
        run: bash native-validation/run-native-pass.sh "$RESULTS" || echo "native-pass-failed=true" >> "$GITHUB_OUTPUT"
      - name: Screenshots of seeded recovery states
        id: shots
        if: always()
        run: bash native-validation/screenshots.sh "$RESULTS" || echo "screenshots-failed=true" >> "$GITHUB_OUTPUT"
      - name: Show summary
        if: always()
        run: |
          cat "$RESULTS/SUMMARY.md" || true
          grep -E '^- ❌' "$RESULTS/SUMMARY.md" | head -12 | sed 's/^- ❌ /::error::/' || true
          grep -E 'first failure' "$RESULTS/SUMMARY.md" | head -12 | sed 's/^ *- first failure: /::error::/' || true
      - name: Upload review evidence (screenshots, summary, UI logs only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duo-${{ matrix.pass }}-evidence-${{ github.run_id }}
          path: |
            native-validation/results/ui-screenshots/**
            native-validation/results/screenshots/**
            native-validation/results/SUMMARY.md
            native-validation/results/status.txt
            native-validation/results/devices.env
            native-validation/results/environment.txt
            native-validation/results/*.log
            native-validation/results/25-ui-test-*-summary.json
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
      - name: Gate
        if: always()
        run: |
          status=$(sed -n 's/^REQUIRED_FAILURES=//p' "$RESULTS/status.txt" 2>/dev/null | head -1)
          echo "required failures: ${status:-unknown}"
          [ "${status:-1}" = "0" ] && [ "${{ steps.shots.outputs.screenshots-failed }}" != "true" ]
