name: duo-validation

# iPhone Duo (October 23) and the iOS 27.1 SDK (Joe, October 12: Duo
# compatibility in 1.0). Apple's guidance: apps run unchanged, but only a
# build with the iOS 27.1 SDK uses the inner display's full screen. This
# runs the same harness as native-validation on the xcode-27 image, which
# has Xcode 27.1 and an "iPhone Duo" simulator device type:
#   - "ios27":  the usual iPhone + iPad simulators on the iOS 27 runtime,
#               built with Xcode 27.1 — is the app and its test-suite OK
#               with the new toolchain and OS?
#   - "duo":    the iPhone Duo simulator stands in for the iPhone.
# Every push to main runs it as well as native-validation (Joe, October
# 14: "increase efforts to run simulations on the Duo"); it decides whether
# release.yml moves to Xcode 27.1 before submission.
#
# Split like native-validation: the ios27 pass in four parts, the Duo's
# iPhone UI tests in three (its simulator is the slowest), each on its own
# machine. Every job publishes its summary, logs and downscaled screenshots
# to a ci-results-duo-<pass>-<part> branch, readable with plain git (the
# artifacts need blob storage not every reviewer can reach).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      xcode:
        description: "Xcode app version on the xcode-27 image (27.1, 27.2)"
        required: true
        default: "27.1"
        type: string
      duo_only:
        description: "Only the Duo simulator's parts (the ios27 pass skipped)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  native:
    name: ${{ matrix.pass }} ${{ matrix.part }} (Xcode ${{ inputs.xcode || '27.1' }})
    runs-on: xcode-27
    # The duo pass downloads the iOS 27.1 platform first and the Duo
    # simulator is slower: run 38341872659 timed out at 110 min after the
    # tests had passed. One part is at most one UI pass now.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # duo_only: the three Duo parts alone, when only the Duo is in question.
        include: ${{ fromJSON(inputs.duo_only && '[{"pass":"duo","part":"ui-iphone-1-of-3"},{"pass":"duo","part":"ui-iphone-2-of-3"},{"pass":"duo","part":"ui-iphone-3-of-3"}]' || '[{"pass":"ios27","part":"core"},{"pass":"ios27","part":"ui-iphone-1-of-2"},{"pass":"ios27","part":"ui-iphone-2-of-2"},{"pass":"ios27","part":"ui-ipad"},{"pass":"duo","part":"ui-iphone-1-of-3"},{"pass":"duo","part":"ui-iphone-2-of-3"},{"pass":"duo","part":"ui-iphone-3-of-3"}]') }}
    env:
      RESULTS: ${{ github.workspace }}/native-validation/results
      DT_PART: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          app="/Applications/Xcode_${{ inputs.xcode || '27.1' }}.app"
          [ -d "$app" ] || { echo "::error::$app is not on this image"; ls -d /Applications/Xcode*.app; exit 1; }
          echo "DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"
          "$app/Contents/Developer/usr/bin/xcodebuild" -version
      - name: Simulators
        run: |
          xcrun simctl list runtimes available
          xcrun simctl list devices available | grep -iE "iphone|ipad" || true
          if [ "${{ matrix.pass }}" = "duo" ]; then
            if ! xcrun simctl list devices available | grep -q "iPhone Duo"; then
              # The image ships the iOS 27.0 runtime; the Duo device type may
              # need 27.1. Try the newest runtime on the image first, then
              # download the current iOS platform (several minutes) and retry.
              pick() { xcrun simctl list runtimes available -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x["platform"]=="iOS"]; r.sort(key=lambda x: [int(p) for p in x["version"].split(".")]); print(r[-1]["identifier"] if r else "")'; }
              runtime=$(pick)
              echo "::notice title=Duo runtime attempt 1::$runtime"
              if ! xcrun simctl create "iPhone Duo" com.apple.CoreSimulator.SimDeviceType.iPhone-Duo "$runtime" 2> create.err; then
                echo "::warning title=simctl create (runtime $runtime)::$(tr '\n' ' ' < create.err | cut -c1-600)"
                xcodebuild -downloadPlatform iOS 2>&1 | tail -3 || true
                runtime=$(pick)
                echo "::notice title=Duo runtime attempt 2::$runtime"
                xcrun simctl create "iPhone Duo" com.apple.CoreSimulator.SimDeviceType.iPhone-Duo "$runtime" 2> create.err \
                  || { echo "::error title=simctl create::$(tr '\n' ' ' < create.err | cut -c1-600)"; exit 1; }
              fi
            fi
            xcrun simctl list devices available | grep "iPhone Duo"
            echo "DT_IPHONE_REGEX=^iPhone Duo$" >> "$GITHUB_ENV"
          fi
      - name: Build + XCTest + swift test
        id: native
        run: bash native-validation/run-native-pass.sh "$RESULTS" || echo "native-pass-failed=true" >> "$GITHUB_OUTPUT"
      - name: Screenshots of seeded recovery states
        id: shots
        # Store-frame captures are not a Duo question; the ios27 pass keeps them.
        if: always() && matrix.pass == 'ios27' && matrix.part == 'core'
        run: bash native-validation/screenshots.sh "$RESULTS" || echo "screenshots-failed=true" >> "$GITHUB_OUTPUT"
      - name: Show summary
        if: always()
        run: |
          cat "$RESULTS/SUMMARY.md" || true
          grep -E '^- ❌' "$RESULTS/SUMMARY.md" | head -4 | sed 's/^- ❌ /::error::/' || true
          # Every failing UI test, named, with its first assertion (ten
          # annotations per step is the limit): the artifact's logs are not
          # readable from every environment, and a name is what a fix needs.
          for d in iphone ipad; do
            f="$RESULTS/25-ui-test-$d.log"; [ -f "$f" ] || continue
            # `|| true`: no failures means grep exits 1, and pipefail would fail
            # the step on a green run (run 38466852602).
            { grep -oE "Test Case '-\[DinnerTogetherUITests\.[A-Za-z_]+ [A-Za-z0-9_]+\]' failed" "$f" || true; } | sort -u | head -3 | while IFS= read -r line; do
              t=$(printf '%s' "$line" | sed -E "s/.*\.[A-Za-z_]+ ([A-Za-z0-9_]+)\]' failed/\1/")
              why=$(grep -m1 -E "\[DinnerTogetherUITests\.[A-Za-z_]+ $t\].*(error|failed)" "$f" | sed -E 's/^.*error: //' | cut -c1-700)
              echo "::error title=ui-$d $t::${why:-failed}"
            done
          done
          # Compiler errors from the new toolchain, readable without the artifact.
          for log in "$RESULTS"/10-build-*.log "$RESULTS"/11-build-*.log; do
            [ -f "$log" ] && grep -E ' error: ' "$log" | sort -u | head -8 | sed "s|^|::error title=$(basename "$log")::|" || true
          done
      - name: Upload review evidence (screenshots, summary, UI logs only)
        if: always()
        # This step once hung 171 minutes and ate the job (A1, issue #15).
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: duo-${{ matrix.pass }}-${{ matrix.part }}-evidence-${{ github.run_id }}
          path: |
            native-validation/results/ui-screenshots/**
            native-validation/results/screenshots/**
            native-validation/results/SUMMARY.md
            native-validation/results/status.txt
            native-validation/results/devices.env
            native-validation/results/environment.txt
            native-validation/results/*.log
            native-validation/results/25-ui-test-*-summary.json
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
      - name: Publish to the ci-results-duo-${{ matrix.pass }}-${{ matrix.part }} branch
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        run: |
          tmp=$(mktemp -d)
          cd "$RESULTS" || exit 0
          # Text results whole; screenshots downscaled (sips) so a push stays small.
          find . -maxdepth 1 -type f \( -name '*.md' -o -name '*.txt' -o -name '*.env' -o -name '*.log' -o -name '*.json' \) -exec cp {} "$tmp"/ \;
          for d in ui-screenshots screenshots; do
            [ -d "$d" ] || continue
            find "$d" -name '*.png' | while IFS= read -r f; do
              mkdir -p "$tmp/$(dirname "$f")"
              sips -Z 1400 "$f" --out "$tmp/$f" >/dev/null 2>&1 || cp "$f" "$tmp/$f"
            done
            find "$d" -name '*.txt' -exec sh -c 'mkdir -p "$1/$(dirname "$2")" && cp "$2" "$1/$2"' _ "$tmp" {} \;
          done
          printf 'run %s\nsha %s\npass %s\npart %s\nxcode %s\n' "${{ github.run_id }}" "${{ github.sha }}" "${{ matrix.pass }}" "${{ matrix.part }}" "${{ inputs.xcode || '27.1' }}" > "$tmp/RUN.txt"
          cd "$tmp" && git init -q -b results
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "duo-validation ${{ matrix.pass }} ${{ matrix.part }} for run ${{ github.run_id }} (${{ github.sha }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/ci-results-duo-${{ matrix.pass }}-${{ matrix.part }}"
      - name: Gate
        if: always()
        run: |
          status=$(sed -n 's/^REQUIRED_FAILURES=//p' "$RESULTS/status.txt" 2>/dev/null | head -1)
          echo "required failures: ${status:-unknown}"
          [ "${status:-1}" = "0" ] && [ "${{ steps.shots.outputs.screenshots-failed }}" != "true" ]
