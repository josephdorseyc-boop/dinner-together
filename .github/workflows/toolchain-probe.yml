name: toolchain-probe

# What a GitHub-hosted macOS runner image actually has: Xcode versions, SDKs,
# simulator runtimes and device types. Manual only; one minute. Used to find
# out whether an iPhone Duo simulator (Xcode 27.1) is available before moving
# the release toolchain (Joe, October 12: Duo compatibility in 1.0).

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label to probe (macos-15, macos-26, xcode-27, …)"
        required: true
        default: xcode-27
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    steps:
      # Findings go out as annotations: run logs live in blob storage that not
      # every environment can read; check-run annotations are plain API.
      - name: Probe
        run: |
          os=$(sw_vers -productVersion)
          echo "::notice title=macOS::$os on ${{ inputs.runner }}"
          echo "::notice title=Default Xcode::$(xcodebuild -version | tr '\n' ' ')"
          for x in /Applications/Xcode*.app; do
            v=$("$x/Contents/Developer/usr/bin/xcodebuild" -version 2>/dev/null | tr '\n' ' ')
            echo "::notice title=Xcode app::$(basename "$x") = $v"
          done
          sdks=$(xcodebuild -showsdks 2>/dev/null | grep -i "iphoneos" | tr -s ' ' | tr '\n' ';')
          echo "::notice title=iOS SDKs (default Xcode)::$sdks"
          for x in /Applications/Xcode*.app; do
            rt=$(DEVELOPER_DIR="$x/Contents/Developer" xcrun simctl list runtimes 2>/dev/null | grep -i "^iOS" | tr '\n' ';')
            duo=$(DEVELOPER_DIR="$x/Contents/Developer" xcrun simctl list devicetypes 2>/dev/null | grep -i "duo" | tr '\n' ';')
            echo "::notice title=$(basename "$x") runtimes::${rt:-none}"
            echo "::notice title=$(basename "$x") iPhone Duo device types::${duo:-none}"
          done
