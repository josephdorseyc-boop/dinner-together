name: toolchain-probe

# What a GitHub-hosted macOS runner image actually has: Xcode versions, SDKs,
# simulator runtimes and device types. Manual only; one minute. Used to find
# out whether an iPhone Duo simulator (Xcode 27.1) is available before moving
# the release toolchain (Joe, October 12: Duo compatibility in 1.0).

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label to probe (macos-15, macos-26, xcode-27, …)"
        required: true
        default: xcode-27
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    steps:
      - name: Xcode installations
        run: |
          sw_vers
          ls -1 /Applications | grep -i xcode || true
          xcode-select -p
          xcodebuild -version
      - name: SDKs and simulator runtimes
        run: |
          xcodebuild -showsdks 2>/dev/null | grep -i ios || true
          xcrun simctl list runtimes 2>/dev/null || true
      - name: Device types (looking for iPhone Duo)
        run: |
          xcrun simctl list devicetypes 2>/dev/null | grep -iE "iphone|ipad" || true
          echo "--- Duo?"
          xcrun simctl list devicetypes 2>/dev/null | grep -i duo || echo "no iPhone Duo device type on this image"
      - name: Newest Xcode on the image
        run: |
          for x in /Applications/Xcode*.app; do echo "$x: $("$x/Contents/Developer/usr/bin/xcodebuild" -version 2>/dev/null | tr '\n' ' ')"; done
