name: ui-review-evidence

'on':
  workflow_dispatch:
    inputs:
      evidence_ref:
        # Only the current tip is fetchable: ci-results is force-pushed and
        # GitHub refuses unreachable commits ("not our ref", run 38306740128).
        # Every native-validation run now also uploads its own
        # ui-review-evidence-<run_id> artifact, which is the durable copy.
        description: ci-results (the latest run) or another reachable ref
        required: true
        default: ci-results
        type: string
      testflight_status:
        description: "Read-only: verify Apple processing for the requested build instead of packaging UI evidence"
        type: boolean
        default: false
      app_version:
        description: "Marketing version to verify in App Store Connect"
        type: string
        default: "1.0"
      build_number:
        description: "Build number to verify (no archive or upload is performed)"
        type: string
        default: "22"

permissions:
  contents: read

jobs:
  package:
    if: ${{ !inputs.testflight_status }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out existing evidence
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.evidence_ref }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ui-screenshots/
            /screenshots/
            /RUN.txt
            /SUMMARY.md
            /25-ui-test-iphone.log
            /25-ui-test-ipad.log

      - name: Package original renders with provenance
        env:
          EVIDENCE_REF: ${{ inputs.evidence_ref }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, shutil, struct, subprocess

          root = Path('.')
          assert (root/'RUN.txt').is_file() and (root/'SUMMARY.md').is_file(), 'Evidence metadata is missing'
          shots = sorted((root/'ui-screenshots').rglob('*.png'))
          assert shots, 'No interactive screenshot PNGs in this evidence revision'
          out = root/'review-evidence'
          out.mkdir()
          for folder in ['ui-screenshots', 'screenshots']:
              if (root/folder).is_dir(): shutil.copytree(root/folder, out/folder)
          for name in ['RUN.txt', 'SUMMARY.md', '25-ui-test-iphone.log', '25-ui-test-ipad.log']:
              if (root/name).is_file(): shutil.copy2(root/name, out/name)
          run = dict(line.split('=', 1) for line in (root/'RUN.txt').read_text().splitlines() if '=' in line)
          assert run.get('sha') and run.get('run_id'), 'App source/run provenance is missing'
          manifest = {
              'evidence_ref_requested': os.environ['EVIDENCE_REF'],
              'evidence_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'app_source_commit': run['sha'],
              'validation_run_id': run['run_id'],
              'status_authority': 'SUMMARY.md (RUN.txt job_status_so_far is provisional)',
              'images': []
          }
          for path in sorted(out.rglob('*.png')):
              data = path.read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', f'Invalid PNG: {path}'
              width, height = struct.unpack('>II', data[16:24])
              manifest['images'].append({'path': str(path.relative_to(out)), 'bytes': len(data),
                                         'width': width, 'height': height, 'sha256': hashlib.sha256(data).hexdigest()})
          total = sum(p.stat().st_size for p in out.rglob('*') if p.is_file())
          assert total < 400 * 1024 * 1024, 'Review package exceeds 400 MiB; inspect unexpected evidence files'
          manifest['payload_bytes_before_manifest'] = total
          (out/'REVIEW_EVIDENCE.json').write_text(json.dumps(manifest, indent=2)+'\n')
          print(f'Packaged {len(manifest["images"])} original PNGs ({total:,} bytes); no image transforms')
          PY

      - name: Upload review evidence only
        uses: actions/upload-artifact@v4
        with:
          name: ui-review-evidence-${{ github.run_id }}
          path: review-evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  verify-testflight:
    if: ${{ inputs.testflight_status }}
    name: Read-only TestFlight processing check
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read build status from Apple (no mutations)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DT_BUNDLE_ID: ${{ secrets.DT_BUNDLE_ID }}
          DT_APP_VERSION: ${{ inputs.app_version }}
          DT_BUILD: ${{ inputs.build_number }}
          DT_STATUS_WAIT_SECONDS: 1800
        run: node release/check-testflight.cjs release/testflight-status
      - name: Publish status summary
        if: always()
        run: cat release/testflight-status/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep build-status evidence (no credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-status-${{ inputs.app_version }}-${{ inputs.build_number }}-${{ github.run_id }}
          path: release/testflight-status/
          if-no-files-found: warn
          retention-days: 14
