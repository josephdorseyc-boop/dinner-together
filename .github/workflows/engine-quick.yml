name: engine-quick

# The one-minute loop for work-in-progress branches: compiles the real
# engine, store, models and importer with the Package.swift harness on Linux
# and runs every XCTest in DinnerTogetherTests/. No macOS, no simulators —
# dispatch native-validation by hand for those.

on:
  push:
    branches: ['wip/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-linux:
    name: swift test on Linux (Package.swift harness)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        shell: bash
        run: |
          set -o pipefail
          swift test 2>&1 | tee swift-test-linux.log
      - name: Verify the expected number of tests executed
        if: always()
        shell: bash
        run: |
          expected=$(grep -L 'canImport(UIKit)' DinnerTogetherTests/*.swift | xargs cat | grep -c 'func test' || true)  # UIKit-only files run on the simulator
          executed=$(grep -oE 'Executed [0-9]+ tests' swift-test-linux.log | grep -oE '[0-9]+' | sort -n | tail -1)
          echo "expected=$expected executed=${executed:-0}"
          test -n "$executed" && [ "$executed" -ge "$expected" ] || { echo "::error::swift test executed ${executed:-0} of $expected expected tests"; exit 1; }
      - name: Failures as annotations (readable without the log)
        if: failure()
        shell: bash
        run: |
          grep -E 'error:|failed -|: error:' swift-test-linux.log | head -10 | sed 's/^/::error::/' || true
