# Dinner, Together — native validation without owning a Mac.
#
# Three jobs:
#   engine-linux  (free, fast)  — `swift test` on Linux via the Package.swift
#                                 harness (engine + store tests). Verifies the
#                                 expected number of tests actually executed.
#   supplemental  (seconds)     — the JavaScript model + a dry run of the
#                                 validation scripts against a fake toolchain.
#   native-ios    (four macOS runners at once: core, two iPhone UI halves,
#                                 iPad UI) — builds the Xcode project, runs XCTest on an
#                                 iPhone and an iPad simulator, screenshots the
#                                 seeded recovery states. Uploads everything as
#                                 the "native-validation-results-<part>" artifacts
#                                 whether or not the steps pass, then FAILS the
#                                 job if any required step failed or could not
#                                 run (no simulator, app not built, tests not
#                                 executed, screenshots missing, no summary).
#
# Triggers on every push and manually (Actions tab → "Run workflow").
name: native-validation

on:
  push:
    branches-ignore: [ci-results, ci-results-linux, 'ci-results-duo-*', store-assets, release-results, 'wip/**']
    # wip/** branches get the 1-minute Linux harness on every push
    # (engine-quick.yml); run this full workflow on them by hand when wanted.
    # Documentation-only pushes don't need a 20-minute macOS run.
    paths-ignore: ['docs/**', '**/*.md', '.github/workflows/ui-review-evidence.yml', '.github/workflows/toolchain-probe.yml', '.github/workflows/duo-validation.yml']
  workflow_dispatch:

# Results are also pushed to the ci-results / ci-results-linux branches so
# they can be read with plain git (artifact downloads need blob-storage
# access that not every environment has). Pushes made with GITHUB_TOKEN do
# not trigger new runs.
permissions:
  contents: write

defaults:
  run:
    # `bash` here means `bash --noprofile --norc -eo pipefail`, so a failing
    # command inside a pipeline (e.g. `swift test | tee`) fails the step.
    shell: bash

jobs:
  engine-linux:
    name: swift test on Linux (Package.swift harness)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: swift test
        run: |
          set -o pipefail
          swift test 2>&1 | tee swift-test-linux.log
      - name: Verify the expected number of tests executed
        if: always()
        run: |
          expected=$(grep -L 'canImport(UIKit)' DinnerTogetherTests/*.swift | xargs cat | grep -c 'func test' || true)  # UIKit-only files run on the simulator
          executed=$(grep -oE 'Executed [0-9]+ tests' swift-test-linux.log | grep -oE '[0-9]+' | sort -n | tail -1)
          echo "expected=$expected executed=${executed:-0}"
          test -n "$executed" && [ "$executed" -ge "$expected" ] || { echo "::error::swift test executed ${executed:-0} of $expected expected tests"; exit 1; }
      - name: Upload Linux log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-linux-log
          path: swift-test-linux.log
          if-no-files-found: error
      - name: Publish Linux log to the ci-results-linux branch
        if: always()
        run: |
          tmp=$(mktemp -d); cp swift-test-linux.log "$tmp"/
          printf 'run_id=%s\nsha=%s\nconclusion_so_far=%s\n' "${{ github.run_id }}" "${{ github.sha }}" "${{ job.status }}" > "$tmp/RUN.txt"
          cd "$tmp" && git init -q -b ci-results-linux
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "engine-linux results for run ${{ github.run_id }} (${{ github.sha }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci-results-linux

  supplemental:
    name: JS model + harness dry run (no Swift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node logic-checks/mirror-test.cjs
      - run: node logic-checks/reconciliation-test.cjs
      - name: Harness dry run against a fake toolchain (proves the gates, not the app)
        run: bash native-validation/dry-run/run.sh
      - name: Release-script dry run (control flow only; no signing)
        run: bash release/dry-run.sh

  native-ios:
    name: Xcode build, XCTest, simulator screenshots (${{ matrix.part }})
    runs-on: macos-15
    # One pass took ~2.5 h on one machine (run 38628522264: 149 of 150
    # minutes). Four machines at once (Joe, October 14): the builds, unit
    # tests and stills on one; the iPhone UI tests in two halves; the iPad
    # UI tests. Each builds the app itself (~15 min). Four, not five: the
    # account runs at most five macOS jobs at once, and a release or Duo
    # run needs one. The workflow fails if any part fails.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        part: [core, ui-iphone-1-of-2, ui-iphone-2-of-2, ui-ipad]
    env:
      RESULTS: ${{ github.workspace }}/native-validation/results
      DT_PART: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 (App Store Connect requires the iOS 26 SDK)
        run: |
          # The image's default Xcode (16.4, iOS 18.5 SDK) builds fine but App
          # Store Connect refuses its uploads ("must be built with the iOS 26
          # SDK or later" — release run 4). Pin one 26.x; fall back to the
          # newest 26.x if the pinned one is ever dropped from the image.
          app="/Applications/Xcode_${DT_XCODE:-26.2}.app"
          [ -d "$app" ] || app=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"
          echo "Selected $app"
      - name: Xcode in use
        run: |
          xcodebuild -version
          xcrun simctl list runtimes available
      - name: Build + XCTest (iPhone and iPad simulators) + swift test
        id: native
        # Non-zero exit = a required step failed; keep going so the artifact
        # and the screenshot attempt still happen, then fail at the gate.
        run: bash native-validation/run-native-pass.sh "$RESULTS" || echo "native-pass-failed=true" >> "$GITHUB_OUTPUT"
      - name: Screenshots of seeded recovery states
        id: shots
        if: ${{ always() && matrix.part == 'core' }}
        run: bash native-validation/screenshots.sh "$RESULTS" || echo "screenshots-failed=true" >> "$GITHUB_OUTPUT"
      - name: Show summary
        if: always()
        run: |
          if [ -f "$RESULTS/SUMMARY.md" ]; then cat "$RESULTS/SUMMARY.md"; else echo "::error::no SUMMARY.md was produced"; fi
          [ -f "$RESULTS/status.txt" ] && cat "$RESULTS/status.txt" || true
          # Surface the verdict lines as annotations too: they are readable
          # through the API even when the results branch cannot be pushed.
          if [ -f "$RESULTS/SUMMARY.md" ]; then
            grep -E '❌|cases on|UI cases on|UI screenshots on' "$RESULTS/SUMMARY.md" | head -40 | while IFS= read -r line; do
              case "$line" in *❌*) echo "::error title=native-validation::${line}";; *) echo "::notice title=native-validation::${line}";; esac
            done
          fi
          # Failing UI tests by name with their first assertion (ten
          # annotations per step is the limit; the gate lines above use some).
          for d in iphone ipad; do
            f="$RESULTS/25-ui-test-$d.log"; [ -f "$f" ] || continue
            # `|| true`: no failures means grep exits 1, and pipefail would fail
            # the step on a green run (run 38466852602).
            { grep -oE "Test Case '-\[DinnerTogetherUITests\.[A-Za-z_]+ [A-Za-z0-9_]+\]' failed" "$f" || true; } | sort -u | head -3 | while IFS= read -r line; do
              t=$(printf '%s' "$line" | sed -E "s/.*\.[A-Za-z_]+ ([A-Za-z0-9_]+)\]' failed/\1/")
              why=$(grep -m1 -E "\[DinnerTogetherUITests\.[A-Za-z_]+ $t\].*(error|failed)" "$f" | sed -E 's/^.*error: //' | cut -c1-700)
              echo "::error title=ui-$d $t::${why:-failed}"
            done
          done
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-validation-results-${{ matrix.part }}
          path: |
            native-validation/results/**
            !native-validation/results/build/**
          if-no-files-found: error
          compression-level: 0   # PNGs and zipped xcresults do not compress; minutes saved (A1 #19)
      # A2-16: the renders alone, small enough to download (the full results
      # artifact is ~600 MB; this one is ~60 MB). Original PNG bytes, with
      # the summary, provenance and UI logs — per run, so a later run's
      # force-push of ci-results never takes an earlier run's renders away.
      - name: Upload review evidence (screenshots, summary, UI logs only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-review-evidence-${{ github.run_id }}-${{ matrix.part }}
          path: |
            native-validation/results/ui-screenshots/**
            native-validation/results/screenshots/**
            native-validation/results/SUMMARY.md
            native-validation/results/status.txt
            native-validation/results/devices.env
            native-validation/results/25-ui-test-*.log
            native-validation/results/25-ui-test-*-summary.json
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
      # What used to go to the ci-results branch from this job, as a small
      # artifact; the publish job below merges the four parts and pushes.
      - name: Bundle this part for ci-results
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/part"
          if [ -d "$RESULTS" ]; then
            (cd "$RESULTS" && tar --exclude='./build' --exclude='*.xcresult.zip' --exclude='*.xcresult' --exclude='*.mp4' -cf - .) | (cd "$RUNNER_TEMP/part" && tar -xf -)
          fi
      - name: Upload this part for ci-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-part-${{ matrix.part }}
          path: ${{ runner.temp }}/part/**
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
      - name: Gate — fail unless every required step ran and passed
        if: always()
        run: |
          [ -f "$RESULTS/SUMMARY.md" ] || { echo "::error::SUMMARY.md missing — the pass did not run"; exit 1; }
          [ -f "$RESULTS/status.txt" ] || { echo "::error::status.txt missing — the pass did not finish"; exit 1; }
          failures=$(sed -n 's/^REQUIRED_FAILURES=//p' "$RESULTS/status.txt" | head -1)
          if [ "${failures:-1}" != "0" ]; then echo "::error::${failures:-?} required step(s) failed or could not run — see SUMMARY.md in the artifact"; exit 1; fi
          if grep -q '❌' "$RESULTS/SUMMARY.md"; then echo "::error::SUMMARY.md contains a failed step"; exit 1; fi
          echo "All required steps passed."

  # The four parts' results merged into the one tree the ci-results branch
  # has always held (native-validation/merge-parts.py), plus one combined
  # ui-review-evidence-<run> artifact for A1 and A2. Never the verdict: each
  # part's gate decides, and the run fails if any part failed.
  publish:
    name: Publish merged results (ci-results)
    needs: native-ios
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Publishing is best effort and never the verdict: a merge or push
    # problem must not fail a run whose four parts all passed.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Download the parts
        uses: actions/download-artifact@v4
        with:
          pattern: ci-part-*
          path: ${{ runner.temp }}/parts
      - name: Merge the parts
        run: python3 native-validation/merge-parts.py "$RUNNER_TEMP/parts" "$RUNNER_TEMP/merged"
      - name: Record merged evidence provenance
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/merged"
          printf 'run_id=%s\nsha=%s\nparts=core,ui-iphone-1-of-2,ui-iphone-2-of-2,ui-ipad\nverdict=see each native-ios part\n' "${{ github.run_id }}" "${{ github.sha }}" > "$RUNNER_TEMP/merged/RUN.txt"
      - name: Upload combined review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-review-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/merged/ui-screenshots/**
            ${{ runner.temp }}/merged/screenshots/**
            ${{ runner.temp }}/merged/RUN.txt
            ${{ runner.temp }}/merged/parts/*/SUMMARY.md
            ${{ runner.temp }}/merged/parts/*/status.txt
            ${{ runner.temp }}/merged/parts/*/25-ui-test-*-summary.json
            ${{ runner.temp }}/merged/SUMMARY.md
            ${{ runner.temp }}/merged/status.txt
            ${{ runner.temp }}/merged/devices.env
            ${{ runner.temp }}/merged/25-ui-test-*.log
            ${{ runner.temp }}/merged/25-ui-test-*-summary.json
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
      # Best effort: the artifacts are the record. Two runs finishing
      # together race on the force-push (run 38305253325 lost to 38306639479),
      # so retry, then carry on.
      - name: Publish results to the ci-results branch (readable with plain git)
        continue-on-error: true
        timeout-minutes: 6
        run: |
          tmp="$RUNNER_TEMP/merged"
          printf 'run_id=%s\nsha=%s\nparts=core,ui-iphone-1-of-2,ui-iphone-2-of-2,ui-ipad\nverdict=see each native-ios part\n' "${{ github.run_id }}" "${{ github.sha }}" > "$tmp/RUN.txt"
          cd "$tmp" && git init -q -b ci-results
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "native-validation results for run ${{ github.run_id }} (${{ github.sha }})"
          published=false
          for attempt in 1 2 3 4; do
            # Bound each push: a stalled connection must fail fast so the retry loop runs (A1, issue #22: the 6-min step timeout killed a hung push before any retry).
            if timeout 60 git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci-results; then
              published=true
              break
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "push attempt $attempt failed; retrying"
              sleep $((attempt * 15))
            fi
          done
          if [ "$published" != true ]; then
            echo "::warning::Results branch publication failed after four attempts. Use the uploaded ui-review-evidence-${{ github.run_id }} artifact."
            exit 1
          fi
