name: release

# Builds a signed App Store build of Dinner, Together on GitHub's macOS
# runners and (optionally) uploads it to App Store Connect / TestFlight.
# Run by hand from the Actions tab. Nothing here runs on a push.
#
# One-time repository secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8   App Store Connect API key (Admin role)
#   APPLE_TEAM_ID                           10-character Team ID
#   DT_BUNDLE_ID                            e.g. com.yourname.dinnertogether
# See release/README.md for where each one comes from.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App Store version (CFBundleShortVersionString), e.g. 1.0"
        required: true
        default: "1.0"
      submit:
        description: "Upload to App Store Connect (TestFlight) after building"
        type: boolean
        default: true
      require_green:
        description: "Refuse unless native-validation passed for this exact commit"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      OUT: ${{ github.workspace }}/release/out
    steps:
      - uses: actions/checkout@v4

      - name: Require a green native-validation run for this commit
        if: ${{ inputs.require_green }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The validation workflow runs on every push; this release must sit on a
          # commit it has already approved (compile, 61 XCTest, UI flows, screenshots).
          runs_json=$(gh api "repos/${{ github.repository }}/actions/workflows/native-validation.yml/runs?head_sha=${{ github.sha }}&per_page=5")
          incomplete=$(printf '%s' "$runs_json" | jq '[.workflow_runs[] | select(.status != "completed")] | length')
          conclusion=$(printf '%s' "$runs_json" | jq -r '[.workflow_runs[] | select(.status=="completed")] | .[0].conclusion // "none"')
          echo "native-validation for ${{ github.sha }}: $conclusion (incomplete runs: $incomplete)"
          [ "$incomplete" = "0" ] || { echo "::error::native-validation is still running for this commit — wait for it to finish, or rerun with require_green=false"; exit 1; }
          [ "$conclusion" = "success" ] || { echo "::error::native-validation is '$conclusion' for this commit — fix that first, or rerun with require_green=false"; exit 1; }

      - name: Xcode in use
        run: xcodebuild -version

      - name: Archive, export, upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DT_BUNDLE_ID: ${{ secrets.DT_BUNDLE_ID }}
          DT_VERSION: ${{ inputs.version }}
          DT_BUILD: ${{ github.run_number }}
          DT_SUBMIT: ${{ inputs.submit && '1' || '0' }}
        run: bash release/build-release.sh "$OUT"

      - name: Show summary
        if: always()
        run: |
          [ -f "$OUT/SUMMARY.md" ] && cat "$OUT/SUMMARY.md" || echo "::error::no SUMMARY.md"
          [ -f "$OUT/status.txt" ] && cat "$OUT/status.txt" || true

      - name: Keep the .ipa, logs and summary (never the signing key)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.version }}-${{ github.run_number }}
          path: |
            release/out/**
            !release/out/private_keys/**
            !release/out/DinnerTogether.xcarchive/**
          if-no-files-found: warn
