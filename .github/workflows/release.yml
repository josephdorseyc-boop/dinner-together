name: release

# Builds a signed App Store build of Dinner, Together on GitHub's macOS
# runners and (optionally) uploads it to App Store Connect / TestFlight.
# Run by hand from the Actions tab. Nothing here runs on a push.
#
# One-time repository secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8   App Store Connect API key (Admin role)
#   APPLE_TEAM_ID                           10-character Team ID
#   DT_BUNDLE_ID                            e.g. com.yourname.dinnertogether
# See release/README.md for where each one comes from.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App Store version (CFBundleShortVersionString), e.g. 1.0"
        required: true
        default: "1.0"
      submit:
        description: "Upload to App Store Connect (TestFlight) after building"
        type: boolean
        default: true
      require_green:
        description: "Refuse unless native-validation passed for this exact commit"
        type: boolean
        default: true

# contents: write only so the summary and logs can be pushed to the
# release-results branch (artifact and log downloads need blob-storage access
# that not every environment has). Pushes made with GITHUB_TOKEN do not
# trigger new runs.
permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      OUT: ${{ github.workspace }}/release/out
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 (App Store Connect requires the iOS 26 SDK)
        run: |
          # The image's default Xcode (16.4, iOS 18.5 SDK) builds fine but App
          # Store Connect refuses its uploads ("must be built with the iOS 26
          # SDK or later" — release run 4). Pin one 26.x; fall back to the
          # newest 26.x if the pinned one is ever dropped from the image.
          app="/Applications/Xcode_${DT_XCODE:-26.2}.app"
          [ -d "$app" ] || app=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"
          echo "Selected $app"

      - name: Require a green native-validation run for this commit
        if: ${{ inputs.require_green }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The validation workflow runs on every push; this release must sit on a
          # commit it has already approved (compile, 61 XCTest, UI flows, screenshots).
          runs_json=$(gh api "repos/${{ github.repository }}/actions/workflows/native-validation.yml/runs?head_sha=${{ github.sha }}&per_page=5")
          incomplete=$(printf '%s' "$runs_json" | jq '[.workflow_runs[] | select(.status != "completed")] | length')
          conclusion=$(printf '%s' "$runs_json" | jq -r '[.workflow_runs[] | select(.status=="completed")] | .[0].conclusion // "none"')
          echo "native-validation for ${{ github.sha }}: $conclusion (incomplete runs: $incomplete)"
          [ "$incomplete" = "0" ] || { echo "::error::native-validation is still running for this commit — wait for it to finish, or rerun with require_green=false"; exit 1; }
          [ "$conclusion" = "success" ] || { echo "::error::native-validation is '$conclusion' for this commit — fix that first, or rerun with require_green=false"; exit 1; }

      - name: Xcode in use
        run: xcodebuild -version

      - name: Archive, export, upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DT_BUNDLE_ID: ${{ secrets.DT_BUNDLE_ID }}
          DT_VERSION: ${{ inputs.version }}
          DT_BUILD: ${{ github.run_number }}
          DT_SUBMIT: ${{ inputs.submit && '1' || '0' }}
        run: bash release/build-release.sh "$OUT"

      - name: Show summary
        if: always()
        run: |
          if [ -f "$OUT/SUMMARY.md" ]; then cat "$OUT/SUMMARY.md"; else echo "::error::no SUMMARY.md"; fi
          [ -f "$OUT/status.txt" ] && cat "$OUT/status.txt" || true
          # The verdict also goes out as check-run annotations: those are
          # readable through the REST API (check-runs/<job>/annotations) even
          # where the log and artifact blob store is not. GitHub keeps at most
          # 10 of each level per step, so the lists are capped.
          if [ -f "$OUT/SUMMARY.md" ]; then
            grep -E '^Version ' "$OUT/SUMMARY.md" | head -1 | sed 's/^/::notice::/'
            grep -E '^  - ' "$OUT/SUMMARY.md" | head -4 | sed 's/^  - /::notice::archived /'
            grep -E '^- (✅|⏭)' "$OUT/SUMMARY.md" | head -4 | sed 's/^- /::notice::/'
            grep -E '^- ❌' "$OUT/SUMMARY.md" | head -3 | sed 's/^- ❌ /::error::/'
            grep -E '^    ' "$OUT/SUMMARY.md" | head -7 | sed 's/^    /::error::/'
          fi

      - name: Publish summary and logs to the release-results branch
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # Text outputs only — never the .ipa, the archive or the key. The key
          # contents never reach a log; its ID and the issuer ID are
          # identifiers, not secrets, but they are scrubbed anyway.
          stage=$(mktemp -d)/run-${{ github.run_number }}; mkdir -p "$stage"
          for f in "$OUT"/SUMMARY.md "$OUT"/status.txt "$OUT"/environment.txt "$OUT"/*.log "$OUT"/ExportOptions-*.plist; do
            [ -f "$f" ] || continue
            sed -e "s/${ASC_KEY_ID:-__none__}/[key-id]/g" -e "s/${ASC_ISSUER_ID:-__none__}/[issuer-id]/g" "$f" > "$stage/$(basename "$f")"
          done
          printf 'run_id=%s\nrun_number=%s\nsha=%s\nversion=%s\nsubmit=%s\nconclusion_so_far=%s\n' \
            "${{ github.run_id }}" "${{ github.run_number }}" "${{ github.sha }}" "${{ inputs.version }}" "${{ inputs.submit }}" "${{ job.status }}" > "$stage/RUN.txt"
          url="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          work=$(mktemp -d); cd "$work"; git init -q
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          if git fetch -q "$url" release-results 2>/dev/null; then git checkout -q -B release-results FETCH_HEAD; else git checkout -q -b release-results; fi
          mkdir -p "run-${{ github.run_number }}"; cp -R "$stage"/. "run-${{ github.run_number }}/"
          git add -A && git commit -q -m "release run ${{ github.run_number }} (${{ github.sha }}): ${{ job.status }}"
          git push -q "$url" HEAD:refs/heads/release-results

      - name: Keep the .ipa, logs and summary (never the signing key)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.version }}-${{ github.run_number }}
          path: |
            release/out/**
            !release/out/private_keys/**
            !release/out/DinnerTogether.xcarchive/**
          if-no-files-found: warn
